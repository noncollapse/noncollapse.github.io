---
layout: portfolio
title: "Posters"
permalink: /portfolio/posters/
robots: "index, follow"
---
<header class="page-intro">
  <h1>Posters</h1>
</header>
<ul class="poster-list">
  {% for poster in site.data.alldetails.posters %}
  <li><a class="poster-entry" href="{{ poster.url }}" target="_blank" rel="noopener noreferrer">
    <img src="{{ poster.img }}" alt="" loading="lazy">
    <div><h2>{{ poster.title }}</h2><p>{{ poster.event }}</p><span>Open PDF ↗</span></div>
  </a></li>
  {% endfor %}
</ul>
